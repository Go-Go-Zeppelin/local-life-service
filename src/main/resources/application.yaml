server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: your-group-id
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        # Kafka 暂不可用时快速保留排队状态，由待投递任务重试。
        max.block.ms: 1000
    listener:
      ack-mode: manual

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包


logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS

# 【秒杀优惠券信息多级缓存改造】本地缓存的配置项(刷新时间、过期时间)、Redis缓存的过期时间
hmdp:
  order:
    unpaid-timeout-minutes: 15
    close-interval-ms: 60000
    close-initial-delay-ms: 60000
    message-retry-interval-ms: 5000
    message-retry-initial-delay-ms: 5000
    # 仅未被消费者领取的排队请求超时后释放库存，正在落库的请求由 Kafka 重试/DLT 处理。
    queue-timeout-seconds: 300
  cache:
    voucher-list:
      mode: caffeine
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 30m
      empty-redis-ttl: 30s
