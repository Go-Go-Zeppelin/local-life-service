# 模型及语言配置统一由 .github/workflows/pr-agent.yml 的环境变量提供。
[pr_reviewer]
persistent_comment = true
extra_instructions = """
依据 PR diff 和可见仓库代码，用中文评审能够定位、能够说明触发条件的实际问题。
优先报告功能错误、并发错误、数据一致性、越权及兼容性回归，给出文件、行号、触发场景和影响。
区分确定的问题与需要业务确认的事项，避免基于不存在的接口或业务规则推测缺陷。

本项目使用 Java 8 编译目标、JDK 17 构建、Spring Boot 2.3 和 MyBatis-Plus。
特别检查 Spring 事务代理和自调用、条件更新、重复消息及回调幂等、数据库唯一约束。
涉及秒杀时，同时检查 Redis Lua 原子性、Kafka 重试与 DLT、MySQL 事务和库存补偿顺序。
涉及笔记发布时，检查版本和审核轮次、作者与审核权限、未发布内容的查询及互动隔离。
涉及 Outbox 时，检查事件与状态同事务、领取凭证与租约、失败重试和固定 Feed score。
涉及 Feed 分页时，检查预读与实际消费的区别、同分值 offset 和过滤后的继续读取。
涉及表结构或接口变化时，检查历史数据迁移、初始化 SQL、DTO 和调用方兼容性。
测试判断以实际运行结果或仓库已有证据为准，避免把缺少某项测试直接当作已存在的功能缺陷。
"""
